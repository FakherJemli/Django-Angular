# Generated by DevOpsGen — Horizontal Pod Autoscaler
#
# PREREQUISITE: Install Kubernetes Metrics Server first:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/\
#     releases/latest/download/components.yaml
#
# Verify installation: kubectl top pods -n default
#
# When HPA is active, REMOVE the 'replicas' field from deployment.yaml
# so they don't fight each other on every helm upgrade.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: django-angular-main
  namespace: default
  labels:
    app.kubernetes.io/name: django-angular-main
    app.kubernetes.io/managed-by: devopsgen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: django-angular-main
  minReplicas: 2          # Keep ≥2 for availability
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # Wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60             # Remove max 1 pod per minute
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60             # Add max 2 pods per minute
