# Generated by DevOpsGen — production-grade Kubernetes Deployment
# ACTION REQUIRED: Replace image.repository with your actual GHCR path.
# After pushing with DevOpsGen CI, the image will be at:
#   ghcr.io/<your-github-org>/<repo-name>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-angular-main
  namespace: default
  labels:
    app.kubernetes.io/name: django-angular-main
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: devopsgen
spec:
  replicas: 1
  # Remove replicas field when HPA is enabled (autoscaler controls it)
  selector:
    matchLabels:
      app.kubernetes.io/name: django-angular-main
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # Zero-downtime rolling update
  template:
    metadata:
      labels:
        app.kubernetes.io/name: django-angular-main
        app.kubernetes.io/component: backend
      annotations:
        # Force pod restart on ConfigMap change (add: kubectl rollout restart)
        checksum/config: ""      # fill with $(kubectl get cm django-angular-main-config -o yaml | sha256sum)
    spec:
      serviceAccountName: django-angular-main
      # ── Security (run as non-root, read-only filesystem) ─────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: django-angular-main
          image: ghcr.io/your-org/django-angular-main:latest  # Replace 'latest' with a pinned SHA in production
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # ── Environment variables from ConfigMap ────────────────────────
          envFrom:
            - configMapRef:
                name: django-angular-main-config
          # ── Health checks ────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          # ── Resource allocation ──────────────────────────────────────────
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # ── Writable scratch space (needed when readOnlyRootFilesystem=true) ──
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
