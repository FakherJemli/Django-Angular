# .pre-commit-config.yaml
# Generated by DevOpsGen — https://devopsgen.io
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: Detect secrets with Gitleaks
        description: Scan staged files for hardcoded secrets before committing

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
        name: Detect private keys
      - id: check-added-large-files
        name: Check for large files (> 500KB)
        args: ['--maxkb=500']
      - id: check-yaml
        name: Validate YAML files

# Run `pre-commit run --all-files` to scan existing files.
# Run `pre-commit autoupdate` to keep hook versions current.
