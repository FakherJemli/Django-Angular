{{- if .Values.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "django-angular-main.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "django-angular-main.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.config }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
