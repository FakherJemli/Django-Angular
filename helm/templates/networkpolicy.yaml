{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "django-angular-main.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "django-angular-main.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "django-angular-main.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.probe.port }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53    # DNS
        - protocol: TCP
          port: 443   # HTTPS to external APIs
{{- end }}
